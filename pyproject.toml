[project]
name = "calendarios"
version = "0.1.0"
description = "Generador de calendarios de turnos rotativos para la residencia (salida en Excel)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "openpyxl>=3.1.5",
    "scipy>=1.14",
]

[project.scripts]
calendarios = "calendarios.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
]
